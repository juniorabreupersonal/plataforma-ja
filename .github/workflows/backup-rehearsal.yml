name: Synthetic backup and restore
on:
  pull_request:
    branches: [main]
    paths: ['ops/backup-rehearsal/**', '.github/workflows/backup-rehearsal.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backup-rehearsal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned official CLI with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ja-supabase-cli
          cd /tmp/ja-supabase-cli
          base=https://github.com/supabase/cli/releases/download/v2.122.0
          curl --fail --silent --show-error --location --proto '=https' "$base/supabase_2.122.0_linux_amd64.tar.gz" -o supabase_2.122.0_linux_amd64.tar.gz
          curl --fail --silent --show-error --location --proto '=https' "$base/checksums.txt" -o checksums.txt
          grep ' supabase_2.122.0_linux_amd64.tar.gz$' checksums.txt > selected.sha256
          sha256sum --check selected.sha256
          tar -xzf supabase_2.122.0_linux_amd64.tar.gz supabase
          echo /tmp/ja-supabase-cli >> "$GITHUB_PATH"
      - name: Safety checks
        run: python3 -m unittest discover -s ops/backup-rehearsal -p 'test_*.py' -v
      - name: Backup source and restore into a different disposable project
        run: python3 ops/backup-rehearsal/run.py
